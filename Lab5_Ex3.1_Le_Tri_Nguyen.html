<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Infographic về lợi ích của công nghệ số trong học tập và video YouTube liên quan.">
	<title>Lợi ích của công nghệ số trong học tập</title>
	<style>
		:root {
			color-scheme: light;
			font-family: Arial, Helvetica, sans-serif;
			background: #eaf7ff;
			color: #10234b;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			padding: 32px 16px 48px;
		}

		main {
			width: min(100%, 860px);
			margin: 0 auto;
		}

		.page-header {
			margin: 0 0 24px;
		}

		.page-header h1 {
			margin: 0 0 8px;
			font-size: clamp(1.7rem, 5vw, 2.5rem);
			line-height: 1.2;
		}

		.page-header p {
			margin: 0;
			line-height: 1.6;
		}

		.infographic {
			display: block;
			width: 100%;
			height: auto;
		}

		.credit {
			margin: 12px 0 0;
			color: #425775;
			font-size: 0.9rem;
			line-height: 1.5;
		}

		.video-section {
			margin-top: 36px;
		}

		.video-section h2 {
			margin: 0 0 18px;
			font-size: clamp(1.4rem, 4vw, 2rem);
			line-height: 1.25;
		}

		.video-frame {
			overflow: hidden;
			width: 100%;
			aspect-ratio: 16 / 9;
			background: #10234b;
		}

		.video-frame iframe {
			display: block;
			width: 100%;
			height: 100%;
			border: 0;
		}

		@media (max-width: 600px) {
			body {
				padding: 16px 0 32px;
			}

			.video-section {
				margin: 28px 16px 0;
			}
		}
	</style>
</head>
<body>
	<main>
		<header class="page-header">
			<h1>Lợi ích của công nghệ số trong học tập</h1>
			<p>Khám phá cách công nghệ số giúp việc học linh hoạt, sáng tạo và hiệu quả hơn.</p>
		</header>

		<img
			class="infographic"
			src="../OneDrive/Pictures/Desktop/Lab05_Ex2.1_Le_Tri_Nguyen.png"
			alt="Infographic: lợi ích của công nghệ số trong học tập, gồm tiếp cận tài nguyên đa dạng, học tập linh hoạt, tăng tương tác và sáng tạo, phản hồi cá nhân hóa và theo dõi tiến trình học tập."
		>
		<p class="credit">Infographic tạo bởi Canva AI, hình ảnh từ Unsplash (Unsplash license).</p>

		<section class="video-section" aria-labelledby="video-title">
			<h2 id="video-title">Video YouTube</h2>
			<div class="video-frame">
				<iframe
					src="https://www.youtube.com/embed/TMdhIPEO5VQ"
					title="Video về lợi ích của công nghệ số trong học tập"
					allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
					referrerpolicy="strict-origin-when-cross-origin"
					allowfullscreen
					loading="lazy"
				></iframe>
			</div>
			<p class="credit">Video tạo bởi CapCut, tài liệu từ Pexels/FreeSound (CC0).</p>
		</section>
	</main>
</body>
</html>
